<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>AI 3대장(제비·참새·하마) 카페</title>
  </head>
  <body class="바">
    <!-- 상단 경계선: 글자 없이 선 하나로 위쪽 AI 화면과 이 바를 가릅니다.
         (프로그램 이름·버전은 창 제목줄에 이미 있으므로 중복 표시하지 않음) -->
    <div class="경계선"></div>

    <!-- 하단 명령바(지휘소): [작성 카드] [버튼 그룹] [최근 질문 미니 이력] -->
    <div class="바그리드">
      <!-- ── 왼쪽: 작성 카드 — 입력과 전송뿐, 군더더기 없음 ── -->
      <div class="작성칸">
        <span class="프롬프트기호">❯</span>
        <div class="작성본문">
          <div id="첨부줄" class="첨부줄 숨김"></div>
          <div class="입력겹침">
            <!-- 화면의 안내 문구는 없애되, 스크린리더용 이름표는 남깁니다 -->
            <textarea id="질문" placeholder="" aria-label="프롬프트 입력"></textarea>
            <!-- 장식 커서 _ : "포커스 없음 AND 내용 없음"일 때만 숨 쉬듯 나타나고,
                 포커스를 얻는 즉시 실제 브라우저 커서에게 자리를 넘깁니다 (CSS 처리) -->
            <span id="깜박커서" class="깜박커서" aria-hidden="true">_</span>
          </div>
        </div>
        <div class="작성버튼들">
          <button id="첨부버튼" class="보조" title="파일·사진 첨부 (붙여넣기 Ctrl+V, 끌어다 놓기도 가능)">＋ 첨부</button>
          <button id="전송버튼" class="주요" title="세 곳에 동시 전송 (Enter)">전송</button>
        </div>
        <input type="file" id="파일입력" multiple hidden />
      </div>

      <!-- ── 가운데: 버튼 그룹 ── -->
      <div class="제어칸">
        <div class="제어줄">
          <span id="전환줄" class="전환묶음" title="창 전환 — 누르면 그 창이 앞으로"></span>
          <button id="창정리버튼" class="보조" title="세 창을 화면에 다시 가지런히 놓고, 펼친 이력은 접습니다 (윈도우 Alt+3 · 맥 ⌃3)">정렬(기본 보기)</button>
        </div>
        <!-- 표시 조절 바: 아래 입력칸의 글자만 바꿉니다 (AI 창 글자는 그대로) -->
        <div class="제어줄 표시조절바">
          <!-- 글자 크기: 위 창 전환처럼 하나의 알약으로 묶어 한 덩어리로 보이게 -->
          <span class="조절라벨">글자</span>
          <span class="조절묶음" title="입력칸 글자 크기">
            <button id="글자작게" class="조절버튼" title="한 단계 작게">A−</button>
            <button
              id="글자크기표시"
              class="조절버튼 조절값"
              title="눌러서 기본 크기(17px)로 되돌리기"
            >
              17px
            </button>
            <button id="글자크게" class="조절버튼" title="한 단계 크게">A+</button>
          </span>

          <!-- 글꼴: 같은 알약 모양. "기본"이 크기의 기본으로 오해되지 않도록
               글꼴 이름 자체로 바꿨습니다. -->
          <span class="조절라벨">글꼴</span>
          <span class="조절묶음" title="입력칸 글꼴">
            <button id="서체기본" class="조절버튼 서체버튼" data-서체="기본"
              title="맥·윈도우가 원래 쓰는 글꼴">시스템</button>
            <button id="서체가독" class="조절버튼 서체버튼" data-서체="가독형"
              title="획이 굵고 자간이 넓어 눈이 덜 피로한 글꼴 (Pretendard)">또렷</button>
            <button id="서체고정" class="조절버튼 서체버튼" data-서체="고정폭"
              title="모든 글자 폭이 같아 코드·표를 읽기 좋은 글꼴 (D2Coding)">고정폭</button>
          </span>

          <button id="고대비토글" class="보조"
            title="켜면 입력칸 글자가 더 밝아지고 배경이 더 어두워집니다 (밝은 곳에서 읽기 좋게)">고대비</button>
        </div>
        <div class="제어줄">
          <button id="새대화버튼" class="보조" title="세 사이트 모두 새 대화로">새 대화</button>
          <button id="모두닫기버튼" class="보조" title="세 AI 창 모두 닫기">모두 닫기</button>
          <button id="모으기버튼" class="보조" title="세 AI가 쓴 답변을 한 문서로 합쳐 클립보드에 복사합니다 (답변이 다 끝난 뒤 누르세요)">세 답변 복사</button>
          <button id="이력토글" class="보조" title="이력·보관함 전체 열기/닫기">이력</button>
          <a href="#" id="설정열기" class="보조설정" title="설정 (프로필·접두어·배치)">설정</a>
        </div>
      </div>

      <!-- ── 오른쪽: 최근 질문 미니 이력 (클릭하면 입력칸으로) ── -->
      <div id="미니이력" class="미니이력" title="최근 질문 — 클릭하면 입력칸으로 불러옵니다"></div>
    </div>

    <!-- 서체 로딩 실패 안내 (입력창 아래, 수초 후 자동 소멸) -->
    <div id="서체안내" class="서체안내 숨김" role="status" aria-live="polite"></div>

    <!-- 실패했을 때만 잠깐 나타나는 알림 (레이아웃에 영향 없음) -->
    <div id="상태" class="토스트 숨김"></div>

    <!-- 접이식 패널: 이력·모은 답변 ("이력" 버튼으로 위로 펼쳐짐) -->
    <div id="확장패널" class="확장패널 숨김">
      <div class="이력머리">
        <span class="라벨">보낸 질문 이력</span>
        <span>
          <a href="#" id="대화내보내기" title="질문+세 답변 자동 보관본을 파일로 저장">대화 내보내기</a>
          ·
          <a href="#" id="이력내보내기" title="질문 이력 전체를 파일로 저장">질문 내보내기</a>
          ·
          <a href="#" id="이력지우기">지우기</a>
        </span>
      </div>
      <input id="이력검색" type="text" placeholder="🔍 이력 검색 (★는 즐겨찾기로 맨 위 고정)" />
      <div id="이력" class="이력"></div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
