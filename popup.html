<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>AI 3대장(제비·참새·하마) 한프로</title>
  </head>
  <body class="바">
    <!-- 하단 명령바(지휘소): [작성 카드] [버튼 그룹] [최근 질문 미니 이력] -->
    <div class="바그리드">
      <!-- ── 왼쪽: 작성 카드 — 입력과 전송뿐, 군더더기 없음 ── -->
      <div class="작성칸">
        <textarea id="질문" placeholder="질문 입력"></textarea>
        <button id="전송버튼" class="주요" title="세 곳에 동시 전송 (Enter)">전송</button>
      </div>

      <!-- ── 가운데: 버튼 그룹 ── -->
      <div class="제어칸">
        <div class="제어줄">
          <span id="전환줄" class="전환묶음" title="창 전환 (Alt+1 왼쪽 · Alt+2 가운데 · Alt+4 오른쪽)"></span>
          <button id="창정리버튼" class="보조" title="창 배치 정렬 (Alt+3)">정렬</button>
        </div>
        <div class="제어줄">
          <button id="새대화버튼" class="보조" title="세 사이트 모두 새 대화로">새 대화</button>
          <button id="모두닫기버튼" class="보조" title="세 AI 창 모두 닫기">모두 닫기</button>
          <button id="모으기버튼" class="보조" title="세 답변 모아 클립보드 복사">답변 모으기</button>
          <button id="이력토글" class="보조" title="이력·보관함 전체 열기/닫기">이력</button>
          <a href="#" id="설정열기" class="보조설정" title="설정 (프로필·접두어·배치)">설정</a>
        </div>
        <div class="제어줄 상태묶음">
          <span id="상태" class="상태"></span>
          <span id="답변진행" class="상태"></span>
        </div>
      </div>

      <!-- ── 오른쪽: 최근 질문 미니 이력 (클릭하면 입력칸으로) ── -->
      <div id="미니이력" class="미니이력" title="최근 질문 — 클릭하면 입력칸으로 불러옵니다"></div>
    </div>

    <!-- 접이식 패널: 이력·모은 답변 ("이력" 버튼으로 위로 펼쳐짐) -->
    <div id="확장패널" class="확장패널 숨김">
      <div class="이력머리">
        <span class="라벨">보낸 질문 이력</span>
        <span>
          <a href="#" id="대화내보내기" title="질문+세 답변 자동 보관본을 파일로 저장">대화 내보내기</a>
          ·
          <a href="#" id="이력내보내기" title="질문 이력 전체를 파일로 저장">질문 내보내기</a>
          ·
          <a href="#" id="이력지우기">지우기</a>
        </span>
      </div>
      <input id="이력검색" type="text" placeholder="🔍 이력 검색 (★는 즐겨찾기로 맨 위 고정)" />
      <div id="이력" class="이력"></div>
      <div id="모으기결과"></div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
